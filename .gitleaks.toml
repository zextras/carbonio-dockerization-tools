# Gitleaks configuration for carbonio-dockerization
# Extends the default ruleset with project-specific allowlists for
# known non-production secrets committed intentionally for local dev/QA use.

title = "Carbonio Dockerization Gitleaks Config"

[allowlist]
  description = "Local dev/QA fixtures - not live credentials"

  # ssl/nginx.key is a self-signed CN=carbonio.localhost dev TLS cert/key
  # pair used only for local docker-compose HTTPS termination (expires 2036).
  # The historical carbonio-podman/chart/files/ssl/nginx.key path was the
  # same pair before the carbonio-podman directory was subtree-split into
  # zextras/carbonio-podman-k3s (#109), where it is also intentionally kept.
  paths = [
    '''ssl/nginx\.key''',
    '''carbonio-podman/chart/files/ssl/nginx\.key''',
  ]

  # QA bulk test-account password (test100..test200@carbonio.localhost),
  # used only against local/QA environments. Historical path
  # carbonio-podman/generate-qa-test-users.sh was moved to
  # zextras/carbonio-podman-k3s in #109, where it is also still present.
  regexes = [
    '''812feee9-c08e-4ec5-9734-07f6e7a6b096''',
  ]
