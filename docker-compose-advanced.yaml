name: carbonio-advanced

services:
  carbonio-mailbox:
    pre_stop:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && unregister"
    post_start:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && register"
    image: ${CARBONIO_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-advanced:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - CARBONIO_STORAGES_HOST=carbonio-storages
      - CARBONIO_STORAGES_PORT=10000
      - CARBONIO_FULL_QUOTA_CHECK_ENABLED=${CARBONIO_FULL_QUOTA_CHECK_ENABLED:-false}
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      event-listener:
        condition: service_started
      carbonio-postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      carbonio-openldap:
        condition: service_healthy
      carbonio-postfix:
        condition: service_healthy
      carbonio-mariadb:
        condition: service_started
    volumes:
      - ./advanced/register-service.sh:/usr/bin/register-service.sh
      - mailbox_data_advanced:/opt/zextras/data/mailbox
      - mailbox_index_advanced:/opt/zextras/index
      - mailbox_store_advanced:/opt/zextras/store
      - mailbox_conf_zextras_advanced:/opt/zextras/conf/zextras

  carbonio-postgres:
    volumes:
      - postgres_data_advanced:/var/lib/postgresql/data
      - ./postgres/init_files.sql:/docker-entrypoint-initdb.d/init_files.sql
      - ./postgres/init_wsc.sql:/docker-entrypoint-initdb.d/init_wsc.sql
      - ./postgres/init_advanced.sql:/docker-entrypoint-initdb.d/init_advanced.sql
      - ./postgres/init_notification_push.sql:/docker-entrypoint-initdb.d/init_notification_push.sql
      - ./postgres/init_videorecorder.sql:/docker-entrypoint-initdb.d/init_videorecorder.sql
      # docs-connector has a DB only in the Advanced edition (Flyway migrates but
      # cannot create the database itself)
      - ./postgres/init_docs_connector.sql:/docker-entrypoint-initdb.d/init_docs_connector.sql

  carbonio-mariadb:
    volumes:
      - mariadb_data_advanced:/var/lib/mysql

  carbonio-openldap:
    volumes:
      - ldap_data_advanced:/opt/zextras
      - ldap_run_advanced:/run/carbonio
      - ldap_ca_advanced:/opt/zextras/conf/ca

  carbonio-catalog:
    volumes:
      - ./carbonio-catalog/advanced/response.json:/config/response.json

  carbonio-files:
    image: ${CARBONIO_FILES_IMAGE:-registry.dev.zextras.com/dev/carbonio-files:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - NETWORKING_CONFIG_CARBONIO_NGINX_LOOKUP_HOST=carbonio-mailbox
      - NETWORKING_CONFIG_CARBONIO_NGINX_LOOKUP_PORT=7072

  carbonio-preview:
    image: ${CARBONIO_PREVIEW_IMAGE:-registry.dev.zextras.com/dev/carbonio-preview:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - NETWORKING_CONFIG_CARBONIO_MEMCACHED_SERVERS=memcached:11211
      - NETWORKING_CONFIG_CARBONIO_NGINX_LOOKUP_URLS=https://carbonio-mailbox:7072

  carbonio-docs-connector:
    image: ${CARBONIO_DOCS_CONNECTOR_IMAGE:-registry.dev.zextras.com/dev/carbonio-docs-connector:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - NETWORKING_CONFIG_CARBONIO_POSTGRESQL_HOST=carbonio-postgres
      - NETWORKING_CONFIG_CARBONIO_POSTGRESQL_PORT=5432
      - APPLICATION_CONFIG_FEATURE_FLAGS_TOTAL_QUOTA=false
    depends_on:
      carbonio-postgres:
        condition: service_started

  carbonio-tasks:
    image: ${CARBONIO_TASKS_IMAGE:-registry.dev.zextras.com/dev/carbonio-tasks:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}

  carbonio-storages:
    image: ${CARBONIO_STORAGES_IMAGE:-registry.dev.zextras.com/dev/carbonio-storages-service:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - STORAGES_HOST=0.0.0.0
      - CONSUL_URL=http://consul:8500
      - POSTGRES_URL=carbonio-postgres:5432
      - MAILBOX_URL=http://carbonio-mailbox:8080
      - MAILBOX_ADMIN_URL=https://carbonio-mailbox:7071
      - MAILBOX_INTERNAL_URL=http://carbonio-mailbox:10000
    depends_on:
      carbonio-postgres:
        condition: service_healthy
    volumes:
      - storages_data_advanced:/storage

  carbonio-message-broker:
    volumes:
      - carbonio-message-broker_data_advanced:/var/lib/rabbitmq

  carbonio-message-dispatcher:
    image: ${CARBONIO_MESSAGE_DISPATCHER_IMAGE:-registry.dev.zextras.com/dev/carbonio-message-dispatcher:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  consul: {}

  carbonio-videoserver:
    image: ${CARBONIO_VIDEOSERVER_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-videoserver-advanced:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - NAT_IP=${NAT_IP:-}
    ports:
      - "20000-20200:20000-20200/udp"
    volumes:
      - shared-videoserver-advanced:/var/lib/videoserver

  carbonio-videorecorder:
    image: ${CARBONIO_VIDEORECORDER_IMAGE:-registry.dev.zextras.com/dev/carbonio-videorecorder:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    volumes:
      - shared-videoserver-advanced:/var/lib/videoserver
    environment:
      - NETWORKING_CONFIG_CARBONIO_SERVICE_HOST=0.0.0.0
      - NETWORKING_CONFIG_CARBONIO_SERVICE_PORT=8090
      - NETWORKING_CONFIG_CARBONIO_SERVICE_DISCOVER_HOST=consul
      - NETWORKING_CONFIG_CARBONIO_SERVICE_DISCOVER_PORT=8500
      - NETWORKING_CONFIG_CARBONIO_POSTGRESQL_HOST=carbonio-postgres
      - NETWORKING_CONFIG_CARBONIO_POSTGRESQL_PORT=5432
      - NETWORKING_CONFIG_CARBONIO_FILES_HOST=carbonio-files
      - NETWORKING_CONFIG_CARBONIO_FILES_PORT=10000
    depends_on:
      consul:
        condition: service_healthy
      consul-register:
        condition: service_completed_successfully
      carbonio-postgres:
        condition: service_healthy

  carbonio-ws-collaboration:
    image: ${CARBONIO_WSC_IMAGE:-registry.dev.zextras.com/dev/carbonio-ws-collaboration:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    environment:
      - VIDEO_RECORDER_HOST=carbonio-videorecorder
      - VIDEO_RECORDER_PORT=8090
      - AUTH_HOST=carbonio-mailbox
      - AUTH_PORT=8742
      - NOTIFICATION_HOST=carbonio-notification-push
      - NOTIFICATION_PORT=10000
      - TURN_SERVER_HOST=localhost
      - TURN_SERVER_PORT=9999
      - LICENSE_SUBSCRIPTION_
      - 'LICENSE_SUBSCRIPTION={"customer":"Soner2","datestart":1648771200000,"vendor":"Zextras","reseller":1,"order_id":-1,"company":"","end_user":"end user 2","paid":true,"min_zextras_version":"4.0.0","dateend":3226694400000,"license_type":"REGULAR","customer_id":"001MA00000B8K1gYAF","revision":1,"modules":{"ZxBackup":{"quantity":100000},"ZxMobile":{"quantity":100000},"ZxAdmin":{"quantity":100000},"ZxPowerstore":{"quantity":100000},"ZxChat":{"quantity":100000},"SproxyD":{"quantity":100000},"ZxDrive":{"quantity":100000},"ZxHA":{"quantity":100000}},"infrastructure_id":"cd50a451-394a-4743-8d6a-17e23f550d52","authentication_token":"ALL_FEATURES_100K","editions":[{"id":"mail","quantity":500},{"id":"activesync","quantity":100},{"id":"chats","quantity":0},{"id":"files","quantity":0},{"id":"workspace","quantity":0},{"id":"mailreplica","quantity":0}],"features":[{"id":"appmail_advanced","quantity":100000,"enabled":true},{"id":"storages_basic","quantity":-1,"enabled":true},{"id":"activesync_shared_folder","quantity":-1,"enabled":true},{"id":"storages_centralized","quantity":-1,"enabled":true},{"id":"files_basic","quantity":-1,"enabled":true},{"id":"storages_hsm","quantity":-1,"enabled":true},{"id":"chats_rooms","quantity":1000,"enabled":true},{"id":"backup_ext_volume","quantity":-1,"enabled":true},{"id":"admins_basic","quantity":-1,"enabled":true},{"id":"wsc_basic","quantity":-1,"enabled":true},{"id":"activesync_basic","quantity":100000,"enabled":true},{"id":"appmail_basic","quantity":-1,"enabled":true},{"id":"ha_basic","quantity":100000,"enabled":true},{"id":"backup_basic","quantity":100000,"enabled":true},{"id":"chats_basic","quantity":-1,"enabled":true},{"id":"storages_conn_sproxyd","quantity":-1,"enabled":true},{"id":"auth_saml","quantity":-1,"enabled":true},{"id":"backup_import_external","quantity":-1,"enabled":true},{"id":"chats_recording","quantity":-1,"enabled":true},{"id":"files_docs_balancing","quantity":-1,"enabled":true},{"id":"storages_conn_basic","quantity":-1,"enabled":true},{"id":"auth_2fa","quantity":-1,"enabled":true},{"id":"backup_realtime","quantity":-1,"enabled":true}],"maintenance_end_date":0,"subscription_end_date":0}'
    depends_on:
      - carbonio-videorecorder
      - carbonio-notification-push

  carbonio-notification-push:
    image: ${CARBONIO_NOTIFICATION_PUSH_IMAGE:-registry.dev.zextras.com/dev/carbonio-notification-push:${CARBONIO_GLOBAL_IMAGES_TAG:-main}}
    labels:
      - "servicePort=10000"
    restart: on-failure
    environment:
      - CONSUL_HTTP_ADDR=http://consul:8500
    volumes:
      - ./notification-push/config.properties:/etc/carbonio/notification-push/config.properties
    depends_on:
      consul:
        condition: service_healthy
      consul-register:
        condition: service_completed_successfully
      carbonio-postgres:
        condition: service_healthy
      carbonio-user-management:
        condition: service_started

volumes:
  ldap_data_advanced:
  ldap_run_advanced:
  ldap_ca_advanced:
  mariadb_data_advanced:
  mailbox_data_advanced:
  mailbox_index_advanced:
  mailbox_store_advanced:
  mailbox_conf_zextras_advanced:
  postgres_data_advanced:
  storages_data_advanced:
  carbonio-message-broker_data_advanced:
  shared-videoserver-advanced:
