name: Sync embedded dockerization

on:
  repository_dispatch:
    types: [dockerization-updated]
  workflow_dispatch:
    inputs:
      source-branch:
        description: "Branch to pull from carbonio-dockerization"
        required: true
        default: "main"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.client_payload.ref || github.event.inputs.source-branch || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync embedded dockerization
        id: subtree
        run: |
          echo "Syncing from branch: ${SOURCE_BRANCH}"

          # Always clean re-add: remove old subtree and add fresh from remote.
          # This avoids all subtree merge/conflict complexity and guarantees
          # the embedded dir is an exact copy of the source repo.
          git rm -rf internal/embedded/carbonio-dockerization/
          git commit -m "chore: remove embedded subtree for clean re-sync"

          git subtree add \
            --prefix=internal/embedded/carbonio-dockerization \
            --squash \
            https://github.com/zextras/carbonio-dockerization.git \
            "${SOURCE_BRANCH}" \
            -m "Squashed 'internal/embedded/carbonio-dockerization/' from ${SOURCE_BRANCH}"

          if git diff --quiet HEAD "origin/${GITHUB_REF_NAME}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.subtree.outputs.changed == 'true' && env.SOURCE_BRANCH == 'main'
        run: |
          git commit --allow-empty -m "chore: sync embedded carbonio-dockerization (${SOURCE_BRANCH})"
          git push origin "${GITHUB_REF_NAME}"

      - name: Dry-run summary (non-main branches)
        if: steps.subtree.outputs.changed == 'true' && env.SOURCE_BRANCH != 'main'
        run: |
          echo "### Subtree pull from '${SOURCE_BRANCH}' succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Changes detected but not pushed (source is not main)." >> "$GITHUB_STEP_SUMMARY"
          echo "Files changed:" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "origin/${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: No changes
        if: steps.subtree.outputs.changed == 'false'
        run: echo "Subtree pull completed but no changes detected."
