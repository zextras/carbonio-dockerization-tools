name: Release and Build

on:
  push:
    branches:
      - devel

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux: .deb + .rpm (CLI + GUI) — native build per arch ──

  build-linux:
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.semantic-release.outputs.new-release-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev pkg-config

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build CLI + GUI and package
        env:
          VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          mkdir -p artifacts

          echo "Building CLI..."
          CGO_ENABLED=0 go build \
            -ldflags="${LDFLAGS}" \
            -o artifacts/carbonio-dockerization-cli \
            ./cmd/carbonio-dockerization-cli

          echo "Building GUI..."
          go build \
            -ldflags="${LDFLAGS}" \
            -o artifacts/carbonio-dockerization-gui \
            ./cmd/carbonio-dockerization-gui

          echo "Creating .deb..."
          nfpm package --config nfpm.yaml --packager deb --target artifacts/

          echo "Creating .rpm..."
          nfpm package --config nfpm.yaml --packager rpm --target artifacts/

          rm -f artifacts/carbonio-dockerization-cli artifacts/carbonio-dockerization-gui

          cd artifacts
          for f in *.deb *.rpm; do sha256sum "$f" > "${f}.sha256"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 1

  # ── macOS: .pkg installer (CLI + GUI .app bundle) ──

  build-macos:
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: arm64
            runner: macos-latest
          - goarch: amd64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.semantic-release.outputs.new-release-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build CLI + GUI and create .pkg installer
        env:
          VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          mkdir -p artifacts

          echo "Building CLI..."
          CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o carbonio-dockerization-cli ./cmd/carbonio-dockerization-cli

          echo "Generating version info for GUI..."
          printf 'package main\n\nfunc init() {\n\tversion = "%s"\n\tcommit = "%s"\n\tdate = "%s"\n}\n' \
            "${VERSION}" "${COMMIT}" "${DATE}" > cmd/carbonio-dockerization-gui/version_gen.go

          echo "Creating .app bundle..."
          GOARCH=${{ matrix.goarch }} fyne package \
            --os darwin \
            --icon "$PWD/carbonio-docker-logo.png" \
            --app-id com.zextras.carbonio-dockerization-gui \
            --name "Carbonio Dockerization GUI" \
            --app-version "${VERSION}" \
            --src ./cmd/carbonio-dockerization-gui

          rm -f cmd/carbonio-dockerization-gui/version_gen.go

          APP_NAME="Carbonio Dockerization GUI.app"
          if [ ! -d "${APP_NAME}" ]; then
            mv *.app "${APP_NAME}" 2>/dev/null
          fi

          echo "Ad-hoc signing .app bundle..."
          codesign --deep --force --options runtime -s - "${APP_NAME}"
          echo "Verifying signature..."
          codesign --verify --verbose "${APP_NAME}"

          echo "Creating .pkg installer..."
          mkdir -p pkg-root/Applications pkg-root/usr/local/bin
          cp -R "${APP_NAME}" pkg-root/Applications/
          cp carbonio-dockerization-cli pkg-root/usr/local/bin/

          PKG_NAME="carbonio-dockerization-${VERSION}-darwin-${{ matrix.goarch }}.pkg"
          pkgbuild \
            --root pkg-root \
            --identifier com.zextras.carbonio-dockerization \
            --version "${VERSION}" \
            --install-location / \
            "artifacts/${PKG_NAME}"

          cd artifacts
          shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 1

  # ── Windows amd64: Inno Setup installer (CLI + GUI .exe) ──

  build-windows:
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.semantic-release.outputs.new-release-version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build CLI + GUI
        env:
          VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
        shell: bash
        run: |
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.date=${DATE}'"

          mkdir -p build-output

          echo "Building CLI..."
          CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o build-output/carbonio-dockerization-cli.exe ./cmd/carbonio-dockerization-cli

          echo "Generating version info for GUI..."
          printf 'package main\n\nfunc init() {\n\tversion = "%s"\n\tcommit = "%s"\n\tdate = "%s"\n}\n' \
            "${VERSION}" "${COMMIT}" "${DATE}" > cmd/carbonio-dockerization-gui/version_gen.go

          echo "Creating GUI .exe..."
          fyne package \
            --os windows \
            --icon "$PWD/carbonio-docker-logo.png" \
            --app-id com.zextras.carbonio-dockerization-gui \
            --name "Carbonio Dockerization GUI" \
            --app-version "${VERSION}" \
            --src ./cmd/carbonio-dockerization-gui

          rm -f cmd/carbonio-dockerization-gui/version_gen.go

          # fyne package produces the exe in the --src directory
          mv "cmd/carbonio-dockerization-gui/Carbonio Dockerization GUI.exe" build-output/carbonio-dockerization-gui.exe

      - name: Create installer with Inno Setup
        env:
          VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
        shell: cmd
        run: |
          mkdir artifacts
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% /DFilesDir=%CD%\build-output /DOutputDir=%CD%\artifacts packaging\windows-installer.iss

      - name: Generate checksum
        shell: bash
        run: |
          cd artifacts
          for f in *.exe; do sha256sum "$f" > "${f}.sha256"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: artifacts/*
          retention-days: 1

  # ── Upload all artifacts to GitHub Release ──

  upload-release-assets:
    needs: [semantic-release, build-linux, build-macos, build-windows]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.semantic-release.outputs.new-release-version }}
          files: release-assets/*
          fail_on_unmatched_files: false
