apiVersion: v1
kind: Pod
metadata:
  name: carbonio-composed-ui
  labels:
    app: carbonio-composed-ui
spec:
  containers:
    - name: app
      image: localhost/carbonio-composed-ui:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          ln -sf /ssl-certs/nginx.key /opt/zextras/conf/nginx.key
          ln -sf /ssl-certs/nginx.crt /opt/zextras/conf/nginx.crt
          exec ./entrypoint-proxy.sh
      env:
        # LDAP and MariaDB are outside the mesh
        - name: LDAP_URL
          value: "ldap://carbonio-openldap:1389"
        - name: LDAP_ROOT_PASSWORD
          value: "qh6hWZvc"
        - name: LDAP_ADMIN_PASSWORD
          value: "password"
        - name: MARIADB_ROOT_PASSWORD
          value: "password"
        - name: MARIADB_URL
          value: "carbonio-mailbox"
        - name: MARIADB_PORT
          value: "3306"
      ports:
        - containerPort: 443
          hostPort: 443
        - containerPort: 6071
          hostPort: 6071
      livenessProbe:
        tcpSocket:
          port: 443
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      volumeMounts:
        - name: ssl
          mountPath: /ssl-certs
        - name: proxy-token
          mountPath: /etc/carbonio/proxy/service-discover
    - name: memcached
      image: docker.io/memcached:1.6.38-alpine
      imagePullPolicy: Always

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      imagePullPolicy: Always
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, -config-dir=/consul/acl]
      volumeMounts:
        - name: consul-agent-acl
          mountPath: /consul/acl/consul-agent-acl.hcl
          subPath: consul-agent-acl.hcl
          readOnly: true

    - name: sidecar
      image: registry.dev.zextras.com/dev/carbonio-proxy-sidecar:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: proxy-token
          mountPath: /shared-tokens

  volumes:
    - name: proxy-token
      hostPath:
        path: ./tokens/proxy/service-discover
        type: DirectoryOrCreate
    - name: ssl
      hostPath:
        path: ../ssl/
        type: Directory
    - name: consul-agent-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-agent-acl.hcl
            path: consul-agent-acl.hcl
