apiVersion: v1
kind: Pod
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  containers:
    - name: consul
      image: docker.io/hashicorp/consul:1.21
      args:
        - agent
        - -server
        - -bootstrap-expect=1
        - -ui
        - -client=0.0.0.0
        - -grpc-port=8502
        - -bind=0.0.0.0
        - -data-dir=/consul/data
        - -disable-host-node-id
        - -node=consul-server
        - -config-dir=/consul/acl
      ports:
        - containerPort: 8500
          hostPort: 8500
        - containerPort: 8502
          hostPort: 8502
      volumeMounts:
        - name: consul-data
          mountPath: /consul/data
        - name: consul-server-acl
          mountPath: /consul/acl/consul-server-acl.hcl
          subPath: consul-server-acl.hcl
          readOnly: true

    - name: kv-init
      image: docker.io/curlimages/curl:latest
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[kv-init] Waiting for consul server..."
          until curl -sf http://localhost:8500/v1/status/leader | grep -q ':'; do sleep 1; done
          echo "[kv-init] Consul ready. Running KV init scripts..."
          for f in /consul-kv/*.sh; do
            echo "[kv-init] Running $(basename "$f")..."
            sh "$f"
          done
          echo "[kv-init] Done. Sleeping."
          exec sleep infinity
      volumeMounts:
        - name: consul-kv-scripts
          mountPath: /consul-kv
          readOnly: true

  volumes:
    - name: consul-data
      persistentVolumeClaim:
        claimName: consul-data
    - name: consul-kv-scripts
      hostPath:
        path: ./consul-kv/
        type: Directory
    - name: consul-server-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-server-acl.hcl
            path: consul-server-acl.hcl
