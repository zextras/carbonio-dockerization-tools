# k3s-only: gives client consul agents a stable DNS name to `-retry-join`.
# ClusterIP is fine because there is a single server (bootstrap-expect=1); a
# multi-server setup would need a headless Service (clusterIP: None) for gossip.
apiVersion: v1
kind: Service
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  selector:
    app: consul-server
  ports:
    - name: server
      port: 8300
      targetPort: 8300
      protocol: TCP
    - name: serf-lan-tcp
      port: 8301
      targetPort: 8301
      protocol: TCP
    - name: serf-lan-udp
      port: 8301
      targetPort: 8301
      protocol: UDP
    - name: http
      port: 8500
      targetPort: 8500
      protocol: TCP
    - name: grpc
      port: 8502
      targetPort: 8502
      protocol: TCP
