apiVersion: v1
kind: Pod
metadata:
  name: carbonio-docs-connector
  labels:
    app: carbonio-docs-connector
spec:
  containers:
    - name: app
      image: registry.dev.zextras.com/dev/carbonio-docs-connector:devel
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          while [ ! -f /etc/carbonio/docs-connector/service-discover/token ]; do sleep 1; done
          export CONSUL_HTTP_TOKEN=$(cat /etc/carbonio/docs-connector/service-discover/token)
          exec /app/entrypoint.sh
      volumeMounts:
        - name: docs-connector-token
          mountPath: /etc/carbonio/docs-connector/service-discover

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      imagePullPolicy: Always
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, -config-dir=/consul/acl]
      volumeMounts:
        - name: consul-agent-acl
          mountPath: /consul/acl/consul-agent-acl.hcl
          subPath: consul-agent-acl.hcl
          readOnly: true

    - name: sidecar
      image: registry.dev.zextras.com/dev/carbonio-docs-connector-sidecar:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: docs-connector-token
          mountPath: /shared-tokens

  volumes:
    - name: docs-connector-token
      hostPath:
        path: ./tokens/docs-connector/service-discover
        type: DirectoryOrCreate
    - name: consul-agent-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-agent-acl.hcl
            path: consul-agent-acl.hcl
