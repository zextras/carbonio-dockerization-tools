apiVersion: v1
kind: Pod
metadata:
  name: carbonio-message-dispatcher
  labels:
    app: carbonio-message-dispatcher
spec:
  restartPolicy: Always
  containers:
    - name: auth
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-auth:devel
      imagePullPolicy: Always
      env:
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/opt/zextras/opentelemetry-javaagent.jar"
        - name: _JAVA_OPTIONS
          value: "-Xms128m -Xmx512m"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://carbonio-monitoring:4318"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
      command: ["/busybox/sh", "-c"]
      args:
        - |
          while [ ! -f /etc/carbonio/message-dispatcher/service-discover/token ]; do sleep 1; done
          export CONSUL_HTTP_TOKEN=$(cat /etc/carbonio/message-dispatcher/service-discover/token)
          exec java -Djava.net.preferIPv4Stack=true \
            -jar /app/carbonio-message-dispatcher-auth.jar
      volumeMounts:
        - name: token-message-dispatcher
          mountPath: /etc/carbonio/message-dispatcher/service-discover

    - name: mongoose
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-mongoose:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: token-message-dispatcher
          mountPath: /etc/carbonio/message-dispatcher/service-discover

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, -config-dir=/consul/acl]
      volumeMounts:
        - name: consul-agent-acl
          mountPath: /consul/acl/consul-agent-acl.hcl
          subPath: consul-agent-acl.hcl
          readOnly: true

    - name: sidecar-auth
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-auth-sidecar:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: token-message-dispatcher
          mountPath: /shared-tokens

    - name: sidecar-http
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-http-sidecar:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: token-message-dispatcher
          mountPath: /shared-tokens

    - name: sidecar-xmpp
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-xmpp-sidecar:devel
      imagePullPolicy: Always
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: token-message-dispatcher
          mountPath: /shared-tokens

  volumes:
    - name: token-message-dispatcher
      hostPath:
        path: ./tokens/message-dispatcher/service-discover
        type: DirectoryOrCreate
    - name: consul-agent-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-agent-acl.hcl
            path: consul-agent-acl.hcl
