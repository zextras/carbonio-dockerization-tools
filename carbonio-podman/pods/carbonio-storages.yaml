apiVersion: v1
kind: Pod
metadata:
  name: carbonio-storages
  labels:
    app: carbonio-storages
spec:
  containers:
    - name: app
      image: registry.dev.zextras.com/dev/carbonio-storages-service:devel
      imagePullPolicy: Always
      env:
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/opt/zextras/opentelemetry-javaagent.jar"
        - name: OTEL_SERVICE_NAME
          value: "storages-service"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://carbonio-monitoring:4318"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
      volumeMounts:
        - name: storages-data
          mountPath: /storage

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.17
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, "-hcl=acl { enabled = true default_policy = \"allow\" tokens { agent = \"00000000-0000-0000-0000-000000000000\" } }"]

    - name: sidecar
      imagePullPolicy: Always
      image: registry.dev.zextras.com/dev/carbonio-storages-sidecar:devel

  volumes:
    - name: storages-data
      emptyDir: {}
