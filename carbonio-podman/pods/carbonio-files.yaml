apiVersion: v1
kind: Pod
metadata:
  name: carbonio-files
  labels:
    app: carbonio-files
spec:
  containers:
    - name: app
      image: registry.dev.zextras.com/dev/carbonio-files:devel
      imagePullPolicy: Always
      env:
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/opt/zextras/opentelemetry-javaagent.jar"
        - name: OTEL_SERVICE_NAME
          value: "files"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://carbonio-monitoring:4318"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      imagePullPolicy: Always
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, "-hcl=acl { enabled = true default_policy = \"allow\" tokens { agent = \"00000000-0000-0000-0000-000000000000\" } }"]

    - name: sidecar
      image: registry.dev.zextras.com/dev/carbonio-files-sidecar:devel
      imagePullPolicy: Always
