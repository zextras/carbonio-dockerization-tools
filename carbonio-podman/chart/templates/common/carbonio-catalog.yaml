{{- if eq (include "carbonio.coreEnabled" .) "true" }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonio-catalog
  labels:
    app: carbonio-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-catalog
  template:
    metadata:
      labels:
        app: carbonio-catalog
    spec:
{{ include "carbonio.deployment.k3sPodDefaults" . | indent 6 }}
{{ include "carbonio.catalog.podbody" . | indent 6 }}
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-catalog
  labels:
    app: carbonio-catalog
spec:
{{ include "carbonio.catalog.podbody" . | indent 2 }}
{{- end }}
{{- end }}
