{{- if eq (include "carbonio.coreEnabled" .) "true" }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonio-message-broker
  labels:
    app: carbonio-message-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-message-broker
  template:
    metadata:
      labels:
        app: carbonio-message-broker
    spec:
{{ include "carbonio.deployment.k3sPodDefaults" . | indent 6 }}
{{ include "carbonio.message-broker.podbody" . | indent 6 }}
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-message-broker
  labels:
    app: carbonio-message-broker
spec:
{{ include "carbonio.message-broker.podbody" . | indent 2 }}
{{- end }}
{{- end }}
