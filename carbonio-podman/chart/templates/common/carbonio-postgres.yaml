{{- if eq (include "carbonio.coreEnabled" .) "true" }}
# Mails slice keeps only the mailbox-db sidecar; files/wsc add their own DB
# sidecars when those groups are enabled.
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carbonio-postgres
  labels:
    app: carbonio-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-postgres
  template:
    metadata:
      labels:
        app: carbonio-postgres
    spec:
      # k8s injects legacy service-link env (e.g. POSTGRES_PORT=tcp://…) from the
      # `postgres` Service, which clobbers the sidecar's POSTGRES_PORT=5432. Disable it.
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      containers:
{{ include "carbonio.postgres.containers" . | indent 8 }}
      volumes:
{{ include "carbonio.postgres.sharedVolumes" . | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-postgres
  labels:
    app: carbonio-postgres
spec:
  containers:
{{ include "carbonio.postgres.containers" . | indent 4 }}
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-data
{{ include "carbonio.postgres.sharedVolumes" . | indent 4 }}
{{- end }}
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: carbonio-advanced connects to postgres directly at the bare host
# `postgres` (global config mailboxPostgresIP=postgres), so alias it to the pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: carbonio-postgres
spec:
  selector:
    app: carbonio-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}
{{- end }}
