{{- if eq (include "carbonio.coreEnabled" .) "true" }}
# Mails slice keeps only the mailbox-db sidecar; files/wsc add their own DB
# sidecars when those groups are enabled.
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-postgres
  labels:
    app: carbonio-postgres
spec:
{{- if eq .Values.platform "k3s" }}
  # k8s injects legacy service-link env (e.g. POSTGRES_PORT=tcp://…) from the
  # `postgres` Service, which clobbers the sidecar's POSTGRES_PORT=5432. Disable it.
  enableServiceLinks: false
  imagePullSecrets:
    - name: {{ .Values.image.pullSecret.name }}
{{- end }}
  containers:
    - name: postgres
      image: docker.io/library/postgres:16
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "admin"
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, -config-dir=/consul/acl]
      volumeMounts:
        - name: consul-agent-acl
          mountPath: /consul/acl/consul-agent-acl.hcl
          subPath: consul-agent-acl.hcl
          readOnly: true
{{- if .Values.groups.mails.enabled }}
    - name: mailbox-db-sidecar
      image: registry.dev.zextras.com/dev/carbonio-mailbox-db-sidecar:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
        - name: PGPASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "carbonio-mailbox-adm"
{{- end }}
{{- if .Values.groups.files.enabled }}
    - name: files-db-sidecar
      image: registry.dev.zextras.com/dev/carbonio-files-db-sidecar:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
        - name: PGPASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "carbonio-files-adm"
    - name: docs-connector-db-sidecar
      image: registry.dev.zextras.com/dev/carbonio-docs-connector-db-sidecar:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
        - name: PGPASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "carbonio-docs-connector-adm"
{{- end }}
{{- if .Values.groups.wsc.enabled }}
    - name: message-dispatcher-db-sidecar
      image: registry.dev.zextras.com/dev/carbonio-message-dispatcher-db-sidecar:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
        - name: PGPASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "carbonio_adm"
    - name: ws-collaboration-db-sidecar
      image: registry.dev.zextras.com/dev/carbonio-ws-collaboration-db-sidecar:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
        - name: PGPASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "carbonio_adm"
{{- end }}
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-data
    - name: init-scripts
      configMap:
        name: postgres-init-scripts
    - name: consul-agent-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-agent-acl.hcl
            path: consul-agent-acl.hcl
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: carbonio-advanced connects to postgres directly at the bare host
# `postgres` (global config mailboxPostgresIP=postgres), so alias it to the pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: carbonio-postgres
spec:
  selector:
    app: carbonio-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}
{{- end }}
