{{- if eq (include "carbonio.coreEnabled" .) "true" }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carbonio-storages
  labels:
    app: carbonio-storages
spec:
  # No governing Service exists (storages is reached via the consul mesh, not
  # direct DNS); serviceName is a required field, so it just names a headless
  # Service that need not exist.
  serviceName: carbonio-storages
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-storages
  template:
    metadata:
      labels:
        app: carbonio-storages
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      containers:
{{ include "carbonio.storages.containers" . | indent 8 }}
      volumes:
{{ include "carbonio.storages.sharedVolumes" . | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: storages-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-storages
  labels:
    app: carbonio-storages
spec:
  containers:
{{ include "carbonio.storages.containers" . | indent 4 }}
  volumes:
    - name: storages-data
      persistentVolumeClaim:
        claimName: storages-data
{{ include "carbonio.storages.sharedVolumes" . | indent 4 }}
{{- end }}
{{- end }}
