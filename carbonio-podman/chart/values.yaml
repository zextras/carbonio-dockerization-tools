# Target platform: k3s (default) or podman.
#   k3s    -> Services + imagePullSecrets are rendered
#   podman -> they are omitted (podman does pod-name DNS and uses `podman login`)
platform: k3s

image:
  # Only pull when the image isn't already on the node. Set to Always to force
  # re-pull (e.g. when a :devel tag has moved). IfNotPresent | Always.
  pullPolicy: Always
  # Private-registry pull secret. With create=true the chart builds a
  # docker-registry secret from the fields below; otherwise a secret named
  # `name` must already exist in the release namespace.
  pullSecret:
    name: zextras-registry
    create: false
    server: registry.dev.zextras.com
    username: ""
    password: ""

# Every container image used by the chart. Keys are the image name (last path
# component) referenced from templates via the `carbonio.image` helper.
# Every image used by a template MUST be listed here; rendering fails otherwise.
images:
  # --- Carbonio main services ---
  carbonio-composed-ui: registry.dev.zextras.com/dev/carbonio-composed-ui:devel
  carbonio-advanced: registry.dev.zextras.com/dev/carbonio-advanced:devel
  carbonio-mailbox: registry.dev.zextras.com/dev/carbonio-mailbox:devel
  carbonio-mariadb: registry.dev.zextras.com/dev/carbonio-mariadb:devel
  carbonio-mta: registry.dev.zextras.com/dev/carbonio-mta:main
  carbonio-openldap: registry.dev.zextras.com/dev/carbonio-openldap:devel
  carbonio-user-management: registry.dev.zextras.com/dev/carbonio-user-management:devel
  carbonio-catalog: registry.dev.zextras.com/dev/carbonio-catalog:devel
  carbonio-message-broker: registry.dev.zextras.com/dev/carbonio-message-broker:devel
  carbonio-storages-service: registry.dev.zextras.com/dev/carbonio-storages-service:devel
  carbonio-files: registry.dev.zextras.com/dev/carbonio-files:devel
  carbonio-docs-connector: registry.dev.zextras.com/dev/carbonio-docs-connector:devel
  carbonio-tasks-ce: registry.dev.zextras.com/dev/carbonio-tasks-ce:devel
  carbonio-preview-ce: registry.dev.zextras.com/dev/carbonio-preview-ce:devel
  carbonio-videoserver-ce: registry.dev.zextras.com/dev/carbonio-videoserver-ce:devel
  carbonio-ws-collaboration: registry.dev.zextras.com/dev/carbonio-ws-collaboration:devel
  carbonio-message-dispatcher-auth: registry.dev.zextras.com/dev/carbonio-message-dispatcher-auth:devel
  carbonio-message-dispatcher-mongoose: registry.dev.zextras.com/dev/carbonio-message-dispatcher-mongoose:devel
  # carbonio-docs-editor is built locally (not published). Only used when
  # docsEditor.enabled is true; point this at your local build.
  carbonio-docs-editor: localhost/carbonio-docs-editor:latest

  # --- Carbonio sidecars ---
  carbonio-mailbox-sidecar: registry.dev.zextras.com/dev/carbonio-mailbox-sidecar:devel
  carbonio-mailbox-admin-sidecar: registry.dev.zextras.com/dev/carbonio-mailbox-admin-sidecar:devel
  carbonio-mailbox-nslookup-sidecar: registry.dev.zextras.com/dev/carbonio-mailbox-nslookup-sidecar:devel
  carbonio-mailbox-internal-api-sidecar: registry.dev.zextras.com/dev/carbonio-mailbox-internal-api-sidecar:devel
  carbonio-advanced-sidecar: registry.dev.zextras.com/dev/carbonio-advanced-sidecar:devel
  carbonio-address-book-sidecar: registry.dev.zextras.com/dev/carbonio-address-book-sidecar:devel
  carbonio-auth-sidecar: registry.dev.zextras.com/dev/carbonio-auth-sidecar:devel
  carbonio-user-management-sidecar: registry.dev.zextras.com/dev/carbonio-user-management-sidecar:devel
  carbonio-catalog-sidecar: registry.dev.zextras.com/dev/carbonio-catalog-sidecar:devel
  carbonio-message-broker-sidecar: registry.dev.zextras.com/dev/carbonio-message-broker-sidecar:devel
  carbonio-storages-sidecar: registry.dev.zextras.com/dev/carbonio-storages-sidecar:devel
  carbonio-files-sidecar: registry.dev.zextras.com/dev/carbonio-files-sidecar:devel
  carbonio-docs-connector-sidecar: registry.dev.zextras.com/dev/carbonio-docs-connector-sidecar:devel
  carbonio-docs-editor-sidecar: registry.dev.zextras.com/dev/carbonio-docs-editor-sidecar:devel
  carbonio-tasks-sidecar: registry.dev.zextras.com/dev/carbonio-tasks-sidecar:devel
  carbonio-preview-sidecar: registry.dev.zextras.com/dev/carbonio-preview-sidecar:devel
  carbonio-videoserver-sidecar: registry.dev.zextras.com/dev/carbonio-videoserver-sidecar:devel
  carbonio-ws-collaboration-sidecar: registry.dev.zextras.com/dev/carbonio-ws-collaboration-sidecar:devel
  carbonio-message-dispatcher-auth-sidecar: registry.dev.zextras.com/dev/carbonio-message-dispatcher-auth-sidecar:devel
  carbonio-message-dispatcher-http-sidecar: registry.dev.zextras.com/dev/carbonio-message-dispatcher-http-sidecar:devel
  carbonio-message-dispatcher-xmpp-sidecar: registry.dev.zextras.com/dev/carbonio-message-dispatcher-xmpp-sidecar:devel
  carbonio-proxy-sidecar: registry.dev.zextras.com/dev/carbonio-proxy-sidecar:devel
  carbonio-mailbox-db-sidecar: registry.dev.zextras.com/dev/carbonio-mailbox-db-sidecar:devel
  carbonio-files-db-sidecar: registry.dev.zextras.com/dev/carbonio-files-db-sidecar:devel
  carbonio-docs-connector-db-sidecar: registry.dev.zextras.com/dev/carbonio-docs-connector-db-sidecar:devel
  carbonio-message-dispatcher-db-sidecar: registry.dev.zextras.com/dev/carbonio-message-dispatcher-db-sidecar:devel
  carbonio-ws-collaboration-db-sidecar: registry.dev.zextras.com/dev/carbonio-ws-collaboration-db-sidecar:devel

  # --- Third-party ---
  consul: docker.io/hashicorp/consul:1.21
  memcached: docker.io/library/memcached:1.6.38-alpine
  postgres: docker.io/library/postgres:16
  otel-lgtm: docker.io/grafana/otel-lgtm:latest
  curl: docker.io/curlimages/curl:latest

# carbonio-docs-editor is optional and built locally (not published). Enable it
# explicitly; set its image under images.carbonio-docs-editor.
docsEditor:
  enabled: false

# Monitoring: the otel-lgtm collector pod + OTEL export in the apps.
# false => no collector pod/Service, and the OTEL SDK is disabled in every app
# (no telemetry emitted, no connection attempts to a missing collector).
monitoring:
  enabled: false

# Carbonio edition: "advanced" (default) = carbonio-advanced image + advanced
# sidecar; "ce" = open-source carbonio-mailbox image, no advanced sidecar.
edition: advanced

# Service groups. Core infra (consul, ldap, postgres, monitoring) is deployed
# whenever any group is enabled.
groups:
  mails:
    enabled: true
  files:
    enabled: false
  wsc:
    enabled: false
  ui:
    enabled: true
  todo:
    enabled: false
