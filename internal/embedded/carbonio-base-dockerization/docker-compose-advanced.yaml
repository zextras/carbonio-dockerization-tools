name: carbonio

services:

  carbonio-mailbox:
    pre_stop:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && unregister"
    post_start:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && register"
    image: ${CARBONIO_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-advanced:devel}
    depends_on:
      carbonio-postgres:
        condition: service_started
      consul:
        condition: service_healthy
    volumes:
      - ./advanced/register-service.sh:/usr/bin/register-service.sh

  carbonio-postgres:
    volumes:
      - ./postgres/init_advanced.sql:/docker-entrypoint-initdb.d/init_advanced.sql

  carbonio-catalog:
    volumes:
      - ./carbonio-catalog/advanced/response.json:/config/response.json

  carbonio-files:
    image: ${CARBONIO_FILES_IMAGE:-registry.dev.zextras.com/dev/carbonio-files:devel}
    environment:
      - CARBONIO_NGINX_LOOKUP_HOST=carbonio-mailbox
      - CARBONIO_NGINX_LOOKUP_PORT=7072

  carbonio-preview:
    image: ${CARBONIO_PREVIEW_IMAGE:-registry.dev.zextras.com/dev/carbonio-preview:devel}
    environment:
      - STORAGES_MEMCACHED_SERVER_FULL_PATH_URLS=memcached:11211
      - STORAGES_NGINX_LOOKUP_SERVER_FULL_PATH_URLS=https://carbonio-mailbox:7072
      - STORAGES_SERVICE_EXTENSION_NGINX_LOOKUP=service/extension/nginx-lookup

  carbonio-tasks:
    image: ${CARBONIO_TASKS_IMAGE:-registry.dev.zextras.com/dev/carbonio-tasks:devel}

  carbonio-message-dispatcher-db:
    image: ${CARBONIO_MESSAGE_DISPATCHER_DB_IMAGE:-registry.dev.zextras.com/dev/carbonio-message-dispatcher-db:devel}

  carbonio-message-dispatcher:
    image: ${CARBONIO_MESSAGE_DISPATCHER_IMAGE:-registry.dev.zextras.com/dev/carbonio-message-dispatcher:devel}

  carbonio-videoserver:
    image: ${CARBONIO_VIDEOSERVER_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-videoserver-advanced:latest}

  carbonio-videorecorder:
    image: ${CARBONIO_VIDEORECORDER_IMAGE:-registry.dev.zextras.com/dev/carbonio-videorecorder:devel}
    volumes:
      - shared-videoserver:/var/lib/videoserver
    environment:
      - CARBONIO_ENV=docker

  carbonio-ws-collaboration:
    image: ${CARBONIO_WSC_IMAGE:-registry.dev.zextras.com/dev/carbonio-ws-collaboration:devel}
    environment:
      - VIDEO_RECORDER_HOST=carbonio-videorecorder
      - VIDEO_RECORDER_PORT=8090
      - AUTH_HOST=carbonio-mailbox
      - AUTH_PORT=8742
      - LICENSE_SUBSCRIPTION_
      - LICENSE_
    depends_on:
      - carbonio-videorecorder