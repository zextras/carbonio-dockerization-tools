name: Notify dockerization-tools

on:
  push:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subtree sync in carbonio-dockerization-tools
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: zextras/carbonio-dockerization-tools
          event-type: dockerization-updated
          client-payload: >-
            {"sha": "${{ github.sha }}", "ref": "${{ github.ref_name }}"}
