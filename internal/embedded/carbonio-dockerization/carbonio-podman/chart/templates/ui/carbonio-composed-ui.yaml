{{- if .Values.groups.ui.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-composed-ui
  labels:
    app: carbonio-composed-ui
spec:
{{- if eq .Values.platform "k3s" }}
  enableServiceLinks: false
  imagePullSecrets:
    - name: {{ .Values.image.pullSecret.name }}
{{- end }}
  containers:
    - name: app
      image: {{ required "images.carbonio-composed-ui is required" (index .Values.images "carbonio-composed-ui") }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          ln -sf /ssl-certs/nginx.key /opt/zextras/conf/nginx.key
          ln -sf /ssl-certs/nginx.crt /opt/zextras/conf/nginx.crt
          exec ./entrypoint-proxy.sh
      env:
        # LDAP is outside the mesh
        - name: LDAP_URL
          value: "ldap://carbonio-openldap:1389"
        - name: LDAP_ROOT_PASSWORD
          value: "qh6hWZvc"
        - name: LDAP_ADMIN_PASSWORD
          value: "password"
      ports:
        - containerPort: 443
          hostPort: 443
        - containerPort: 6071
          hostPort: 6071
      livenessProbe:
        tcpSocket:
          port: 443
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      volumeMounts:
        - name: ssl
          mountPath: /ssl-certs
        - name: proxy-token
          mountPath: /etc/carbonio/proxy/service-discover
    - name: memcached
      image: {{ required "images.memcached is required" (index .Values.images "memcached") }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}

    - name: consul-agent
      image: {{ required "images.consul is required" (index .Values.images "consul") }}
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, -config-dir=/consul/acl]
      volumeMounts:
        - name: consul-agent-acl
          mountPath: /consul/acl/consul-agent-acl.hcl
          subPath: consul-agent-acl.hcl
          readOnly: true

    - name: sidecar
      image: {{ required "images.carbonio-proxy-sidecar is required" (index .Values.images "carbonio-proxy-sidecar") }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            configMapKeyRef:
              name: consul-acl
              key: bootstrap-token
      volumeMounts:
        - name: proxy-token
          mountPath: /shared-tokens

  volumes:
    - name: proxy-token
      emptyDir: {}
    - name: ssl
      secret:
        secretName: carbonio-ui-ssl
    - name: consul-agent-acl
      configMap:
        name: consul-acl
        items:
          - key: consul-agent-acl.hcl
            path: consul-agent-acl.hcl
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: composed-ui registers itself as a Carbonio server (proxy) in LDAP
# under its hostname. Legacy code (e.g. the mailbox's getTrustedIPs) does
# `zmprov gas` and resolves every server's hostname, so carbonio-composed-ui
# must resolve. Headless → real pod IP (ClusterIP would break source-IP trust).
apiVersion: v1
kind: Service
metadata:
  name: carbonio-composed-ui
  labels:
    app: carbonio-composed-ui
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: carbonio-composed-ui
  ports:
    - name: https
      port: 443
    - name: admin-proxy
      port: 6071
{{- end }}
{{- end }}
