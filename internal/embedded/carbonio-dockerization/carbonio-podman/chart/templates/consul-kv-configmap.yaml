{{- if eq (include "carbonio.coreEnabled" .) "true" }}
# consul-server's kv-init container runs these scripts once the server is up
# (license + the default read-only ACL token). Replaces the ./consul-kv hostPath.
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-kv-scripts
data:
{{ (.Files.Glob "files/consul-kv/*").AsConfig | indent 2 }}
{{- end }}
