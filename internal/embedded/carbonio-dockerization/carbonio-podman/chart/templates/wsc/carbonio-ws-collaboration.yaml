{{- if .Values.groups.wsc.enabled }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonio-ws-collaboration
  labels:
    app: carbonio-ws-collaboration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-ws-collaboration
  template:
    metadata:
      labels:
        app: carbonio-ws-collaboration
    spec:
{{ include "carbonio.deployment.k3sPodDefaults" . | indent 6 }}
{{ include "carbonio.ws-collaboration.podbody" . | indent 6 }}
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-ws-collaboration
  labels:
    app: carbonio-ws-collaboration
spec:
{{ include "carbonio.ws-collaboration.podbody" . | indent 2 }}
{{- end }}
{{- end }}
