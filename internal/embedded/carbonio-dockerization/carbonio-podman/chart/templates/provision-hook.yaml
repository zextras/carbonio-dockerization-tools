{{- if and (eq .Values.platform "k3s") .Values.provision.auto .Values.groups.mails.enabled }}
# k3s auto-provisioning: the in-cluster equivalent of `make carbonio_provision`.
# A post-install/post-upgrade Helm hook Job runs zmprov.prov against
# carbonio-mailbox-0, then regenerates composed-ui's nginx. Idempotent (probes
# the domain first), so it is a cheap no-op on upgrades once provisioned.
#
# The SA/Role/RoleBinding/ConfigMap are ordinary release resources — created
# before post-install hooks run — so the hook Job can consume them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbonio-provision
  labels:
    app: carbonio-provision
imagePullSecrets:
  - name: {{ .Values.image.pullSecret.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: carbonio-provision
  labels:
    app: carbonio-provision
rules:
  # wait for / read the target pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # exec zmprov / zmproxyconfgen into them
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # rollout restart + wait on the mailbox after first provisioning (it reads
  # proxy config from LDAP at boot, so it must restart once the domain exists)
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carbonio-provision
  labels:
    app: carbonio-provision
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: carbonio-provision
subjects:
  - kind: ServiceAccount
    name: carbonio-provision
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carbonio-provision
  labels:
    app: carbonio-provision
data:
{{ (.Files.Glob "files/zmprov.prov").AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: carbonio-provision
  labels:
    app: carbonio-provision
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    # Delete a prior hook Job before creating the new one (Jobs are immutable),
    # and keep the last one around for log inspection.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  # Guard against a mailbox that never comes up. Generous because first-run
  # provisioning also does an (ordered, slow) rollout restart of the mailbox.
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app: carbonio-provision
    spec:
      serviceAccountName: carbonio-provision
      enableServiceLinks: false
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      containers:
        - name: provision
          image: {{ required "images.kubectl is required" (index .Values.images "kubectl") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              DOMAIN=carbonio.localhost
              # Pod "Ready" only means containers are running; mailboxd keeps
              # booting for a while after and zmprov errors until it's up. So we
              # don't trust a single probe — we poll zmprov until it gives a
              # DEFINITIVE answer (domain present or NO_SUCH_DOMAIN), for up to
              # ZMPROV_TRIES*2s. Anything else = "not ready yet, keep waiting".
              ZMPROV_TRIES=300   # ~10 min

              # Probe zmprov once, into $out. Sets $state to present|absent|""
              # (empty = mailboxd not ready yet / unrecognized). Kept inline (not
              # a function) so $out survives — a function called via $(...) runs
              # in a subshell and would lose it.
              probe() {
                out=$(kubectl exec -i carbonio-mailbox-0 -c app -- \
                  sh -c "echo 'gd $DOMAIN' | zmprov 2>&1") || true
                state=""
                if printf '%s' "$out" | grep -q 'NO_SUCH_DOMAIN'; then
                  state=absent
                elif printf '%s' "$out" | grep -qi "$DOMAIN"; then
                  state=present
                fi
              }

              echo "==> Waiting for carbonio-mailbox-0 to be Ready..."
              kubectl wait --for=condition=Ready pod/carbonio-mailbox-0 --timeout=900s

              echo "==> Waiting for zmprov to answer (mailboxd boot)..."
              out=""; state=""; i=0
              while [ "$i" -lt "$ZMPROV_TRIES" ]; do
                probe
                [ -n "$state" ] && break
                i=$((i + 1)); sleep 2
              done

              # Fail loudly instead of silently no-op'ing (the old bug: the loop
              # could expire with nothing provisioned, yet the hook exited 0).
              if [ -z "$state" ]; then
                echo "ERROR: zmprov never answered after $((ZMPROV_TRIES * 2))s. Last output:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              fi

              if [ "$state" = present ]; then
                echo "==> Domain already exists; nothing to provision. Done."
                exit 0
              fi

              echo "==> Running zmprov.prov..."
              kubectl exec -i carbonio-mailbox-0 -c app -- zmprov < /provision/zmprov.prov

              echo "==> Verifying $DOMAIN was created..."
              probe
              if [ "$state" != present ]; then
                echo "ERROR: $DOMAIN still missing after zmprov.prov. Last output:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              fi

              # The mailbox reads its proxy/config from LDAP at startup, so after
              # first provisioning it must restart to register correctly (nginx
              # has no valid upstream until then). Ordered, so slow.
              echo "==> Restarting mailbox to pick up the provisioned config..."
              kubectl rollout restart statefulset/carbonio-mailbox
              kubectl rollout status statefulset/carbonio-mailbox --timeout=1800s

              echo "==> Waiting for carbonio-composed-ui to be Ready..."
              kubectl wait --for=condition=Ready pod/carbonio-composed-ui --timeout=300s
              echo "==> Regenerating nginx config + reloading composed-ui..."
              kubectl exec carbonio-composed-ui -c app -- sh -c \
                '/usr/bin/zmproxyconfgen && /opt/zextras/common/sbin/nginx -c /opt/zextras/conf/nginx.conf -s reload'

              echo "==> Done."
          volumeMounts:
            - name: prov
              mountPath: /provision
              readOnly: true
      volumes:
        - name: prov
          configMap:
            name: carbonio-provision
{{- end }}
