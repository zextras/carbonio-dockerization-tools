{{- if and (eq (include "carbonio.coreEnabled" .) "true") .Values.monitoring.enabled }}
# Custom Grafana dashboards are intentionally omitted in this slice; otel-lgtm
# still accepts OTLP on 4317/4318 and serves Grafana on 3000.
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonio-monitoring
  labels:
    app: carbonio-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-monitoring
  template:
    metadata:
      labels:
        app: carbonio-monitoring
    spec:
{{ include "carbonio.deployment.k3sPodDefaults" . | indent 6 }}
{{ include "carbonio.monitoring.podbody" . | indent 6 }}
---
# k3s-only: OTEL exporters across pods send directly to :4317 / :4318.
apiVersion: v1
kind: Service
metadata:
  name: carbonio-monitoring
  labels:
    app: carbonio-monitoring
spec:
  selector:
    app: carbonio-monitoring
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: grafana
      port: 3000
      targetPort: 3000
      protocol: TCP
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-monitoring
  labels:
    app: carbonio-monitoring
spec:
{{ include "carbonio.monitoring.podbody" . | indent 2 }}
{{- end }}
{{- end }}
