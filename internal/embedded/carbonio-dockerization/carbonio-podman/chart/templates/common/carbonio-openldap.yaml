{{- if eq (include "carbonio.coreEnabled" .) "true" }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
{{- if eq .Values.platform "k3s" }}
  enableServiceLinks: false
  imagePullSecrets:
    - name: {{ .Values.image.pullSecret.name }}
{{- end }}
  containers:
    - name: openldap
      image: registry.dev.zextras.com/dev/carbonio-openldap:devel
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      ports:
        - containerPort: 1389
      volumeMounts:
        - name: ldap-data
          mountPath: /opt/zextras/data/ldap
        - name: ldap-run
          mountPath: /run/carbonio
        - name: ldap-conf
          mountPath: /opt/zextras/conf
  volumes:
    - name: ldap-data
      persistentVolumeClaim:
        claimName: ldap-data
    - name: ldap-run
      persistentVolumeClaim:
        claimName: ldap-run
    - name: ldap-conf
      persistentVolumeClaim:
        claimName: ldap-conf
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: LDAP is outside the mesh, resolved directly as carbonio-openldap:1389.
apiVersion: v1
kind: Service
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
  selector:
    app: carbonio-openldap
  ports:
    - name: ldap
      port: 1389
      targetPort: 1389
      protocol: TCP
{{- end }}
{{- end }}
