{{- if eq (include "carbonio.coreEnabled" .) "true" }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
  serviceName: carbonio-openldap
  replicas: 1
  selector:
    matchLabels:
      app: carbonio-openldap
  template:
    metadata:
      labels:
        app: carbonio-openldap
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      containers:
{{ include "carbonio.openldap.containers" . | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: ldap-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: ldap-run
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: ldap-conf
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
  containers:
{{ include "carbonio.openldap.containers" . | indent 4 }}
  volumes:
    - name: ldap-data
      persistentVolumeClaim:
        claimName: ldap-data
    - name: ldap-run
      persistentVolumeClaim:
        claimName: ldap-run
    - name: ldap-conf
      persistentVolumeClaim:
        claimName: ldap-conf
{{- end }}
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: LDAP is outside the mesh, resolved directly as carbonio-openldap:1389.
apiVersion: v1
kind: Service
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
  selector:
    app: carbonio-openldap
  ports:
    - name: ldap
      port: 1389
      targetPort: 1389
      protocol: TCP
{{- end }}
{{- end }}
