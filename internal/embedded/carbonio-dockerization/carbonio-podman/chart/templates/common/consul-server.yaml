{{- if eq (include "carbonio.coreEnabled" .) "true" }}
{{- if eq .Values.platform "k3s" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  serviceName: consul-server
  replicas: 1
  selector:
    matchLabels:
      app: consul-server
  template:
    metadata:
      labels:
        app: consul-server
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      containers:
{{ include "carbonio.consul-server.containers" . | indent 8 }}
      volumes:
{{ include "carbonio.consul-server.sharedVolumes" . | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: consul-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
{{- else }}
apiVersion: v1
kind: Pod
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  containers:
{{ include "carbonio.consul-server.containers" . | indent 4 }}
  volumes:
    - name: consul-data
      persistentVolumeClaim:
        claimName: consul-data
{{ include "carbonio.consul-server.sharedVolumes" . | indent 4 }}
{{- end }}
{{- if eq .Values.platform "k3s" }}
---
# k3s-only: stable DNS name for client agents to -retry-join. ClusterIP is fine
# with a single server (bootstrap-expect=1); multi-server would need headless.
apiVersion: v1
kind: Service
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  selector:
    app: consul-server
  ports:
    - name: server
      port: 8300
      targetPort: 8300
      protocol: TCP
    - name: serf-lan-tcp
      port: 8301
      targetPort: 8301
      protocol: TCP
    - name: serf-lan-udp
      port: 8301
      targetPort: 8301
      protocol: UDP
    - name: http
      port: 8500
      targetPort: 8500
      protocol: TCP
    - name: grpc
      port: 8502
      targetPort: 8502
      protocol: TCP
---
# k3s-only: carbonio-advanced's JGroups stack (baked into the image, not
# overridable per-deploy) uses the bare name `consul`. Alias it to the consul
# server with a second Service of that name.
apiVersion: v1
kind: Service
metadata:
  name: consul
  labels:
    app: consul-server
spec:
  selector:
    app: consul-server
  ports:
    - name: server
      port: 8300
      targetPort: 8300
      protocol: TCP
    - name: serf-lan-tcp
      port: 8301
      targetPort: 8301
      protocol: TCP
    - name: serf-lan-udp
      port: 8301
      targetPort: 8301
      protocol: UDP
    - name: http
      port: 8500
      targetPort: 8500
      protocol: TCP
    - name: grpc
      port: 8502
      targetPort: 8502
      protocol: TCP
{{- end }}
{{- end }}
