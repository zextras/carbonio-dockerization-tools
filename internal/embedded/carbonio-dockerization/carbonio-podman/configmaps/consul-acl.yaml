apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-acl
data:
  bootstrap-token: "00000000-0000-0000-0000-000000000000"
  consul-agent-acl.hcl: |
    acl {
      enabled        = true
      default_policy = "deny"
      tokens {
        agent   = "00000000-0000-0000-0000-000000000000"
        default = "11111111-1111-1111-1111-111111111111"
      }
    }
  consul-server-acl.hcl: |
    acl {
      enabled        = true
      default_policy = "deny"
      tokens {
        initial_management = "00000000-0000-0000-0000-000000000000"
        default            = "11111111-1111-1111-1111-111111111111"
      }
    }
