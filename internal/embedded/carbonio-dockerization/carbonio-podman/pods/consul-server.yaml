apiVersion: v1
kind: Pod
metadata:
  name: consul-server
  labels:
    app: consul-server
spec:
  containers:
    - name: consul
      image: docker.io/hashicorp/consul:1.17
      args:
        - agent
        - -server
        - -bootstrap-expect=1
        - -ui
        - -client=0.0.0.0
        - -grpc-port=8502
        - -bind=0.0.0.0
        - -data-dir=/consul/data
        - -disable-host-node-id
        - -node=consul-server
        - -hcl=acl { enabled = true default_policy = "allow" tokens { initial_management = "00000000-0000-0000-0000-000000000000" } }
      ports:
        - containerPort: 8500
          hostPort: 8500
        - containerPort: 8502
          hostPort: 8502
      volumeMounts:
        - name: consul-data
          mountPath: /consul/data
  volumes:
    - name: consul-data
      emptyDir: {}
