apiVersion: v1
kind: Pod
metadata:
  name: carbonio-openldap
  labels:
    app: carbonio-openldap
spec:
  containers:
    - name: openldap
      image: registry.dev.zextras.com/dev/carbonio-openldap:devel
      ports:
        - containerPort: 1389
      volumeMounts:
        - name: ldap-data
          mountPath: /opt/zextras
        - name: ldap-run
          mountPath: /run/carbonio
        - name: ldap-ca
          mountPath: /opt/zextras/conf/ca
  volumes:
    - name: ldap-data
      emptyDir: {}
    - name: ldap-run
      emptyDir: {}
    - name: ldap-ca
      emptyDir: {}
