apiVersion: v1
kind: Pod
metadata:
  name: carbonio-videoserver
  labels:
    app: carbonio-videoserver
spec:
  containers:
    - name: app
      image: registry.dev.zextras.com/dev/carbonio-videoserver-ce:devel
      imagePullPolicy: Always
      ports:
        - containerPort: 8088
        - containerPort: 20000
          hostPort: 20000
          protocol: UDP
        - containerPort: 20200
          hostPort: 20200
          protocol: UDP
      volumeMounts:
        - name: videoserver-data
          mountPath: /var/lib/videoserver

    - name: consul-agent
      image: docker.io/hashicorp/consul:1.21
      args: [agent, -client=0.0.0.0, -bind=0.0.0.0, -retry-join=consul-server, -grpc-port=8502, "-hcl=acl { enabled = true default_policy = \"allow\" tokens { agent = \"00000000-0000-0000-0000-000000000000\" } }"]

    - name: sidecar
      image: registry.dev.zextras.com/dev/carbonio-videoserver-sidecar:latest
      imagePullPolicy: Always

  volumes:
    - name: videoserver-data
      emptyDir: {}
