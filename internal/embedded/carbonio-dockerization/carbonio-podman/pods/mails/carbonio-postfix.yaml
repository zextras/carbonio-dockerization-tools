apiVersion: v1
kind: Pod
metadata:
  name: carbonio-postfix
  labels:
    app: carbonio-postfix
spec:
  containers:
    - name: app
      image: registry.dev.zextras.com/dev/carbonio-mta:latest
      imagePullPolicy: Always
      env:
        - name: LDAP_HOST
          value: "carbonio-openldap"
        - name: LDAP_PORT
          value: "1389"
        - name: LDAP_ROOT_PASSWORD
          value: "qh6hWZvc"
        - name: LDAP_ADMIN_PASSWORD
          value: "password"
      ports:
        - containerPort: 25
          hostPort: 20025