name: carbonio-advanced

services:
  carbonio-mailbox:
    pre_stop:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && unregister"
    post_start:
      - command: /bin/sh -c ". /usr/bin/register-service.sh && register"
    image: ${CARBONIO_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-advanced:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    depends_on:
      event-listener:
        condition: service_started
      carbonio-postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      carbonio-openldap:
        condition: service_healthy
      carbonio-postfix:
        condition: service_healthy
      carbonio-mariadb:
        condition: service_started
    volumes:
      - ./advanced/register-service.sh:/usr/bin/register-service.sh
      - app-volume-advanced:/localconfig
      - mailbox_data_advanced:/opt/zextras/data/mailbox
      - mailbox_index_advanced:/opt/zextras/index
      - mailbox_store_advanced:/opt/zextras/store

  carbonio-postgres:
    volumes:
      - postgres_data_advanced:/var/lib/postgresql/data
      - ./postgres/init_files.sql:/docker-entrypoint-initdb.d/init_files.sql
      - ./postgres/init_wsc.sql:/docker-entrypoint-initdb.d/init_wsc.sql
      - ./postgres/init_advanced.sql:/docker-entrypoint-initdb.d/init_advanced.sql

  carbonio-mariadb:
    volumes:
      - mariadb_data_advanced:/var/lib/mysql

  carbonio-openldap:
    volumes:
      - ldap_data_advanced:/opt/zextras
      - ldap_run_advanced:/run/carbonio
      - ldap_ca_advanced:/opt/zextras/conf/ca

  carbonio-catalog:
    volumes:
      - ./carbonio-catalog/advanced/response.json:/config/response.json

  carbonio-files:
    image: ${CARBONIO_FILES_IMAGE:-registry.dev.zextras.com/dev/carbonio-files:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    environment:
      - CARBONIO_NGINX_LOOKUP_HOST=carbonio-mailbox
      - CARBONIO_NGINX_LOOKUP_PORT=7072

  carbonio-preview:
    image: ${CARBONIO_PREVIEW_IMAGE:-registry.dev.zextras.com/dev/carbonio-preview:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    environment:
      - STORAGES_MEMCACHED_SERVER_FULL_PATH_URLS=memcached:11211
      - STORAGES_NGINX_LOOKUP_SERVER_FULL_PATH_URLS=https://carbonio-mailbox:7072
      - STORAGES_SERVICE_EXTENSION_NGINX_LOOKUP=service/extension/nginx-lookup

  carbonio-tasks:
    image: ${CARBONIO_TASKS_IMAGE:-registry.dev.zextras.com/dev/carbonio-tasks:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}

  carbonio-storages:
    image: ${CARBONIO_STORAGES_IMAGE:-registry.dev.zextras.com/dev/carbonio-storages-service:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    environment:
      - STORAGES_HOST=0.0.0.0
      - CONSUL_URL=http://consul:8500
      - POSTGRES_URL=carbonio-postgres:5432
      - MAILBOX_URL=http://carbonio-mailbox:8080
      - MAILBOX_ADMIN_URL=https://carbonio-mailbox:7071
    depends_on:
      carbonio-postgres:
        condition: service_healthy
    volumes:
      - storages_data_advanced:/storage

  carbonio-message-broker:
    volumes:
      - carbonio-message-broker_data_advanced:/var/lib/rabbitmq

  carbonio-message-dispatcher:
    image: ${CARBONIO_MESSAGE_DISPATCHER_IMAGE:-registry.dev.zextras.com/dev/carbonio-message-dispatcher:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}

  consul:
    volumes:
      - consul-data-advanced:/consul/data

  carbonio-videoserver:
    image: ${CARBONIO_VIDEOSERVER_ADVANCED_IMAGE:-registry.dev.zextras.com/dev/carbonio-videoserver-advanced:${CARBONIO_GLOBAL_IMAGES_TAG:-latest}}
    volumes:
      - shared-videoserver-advanced:/var/lib/videoserver

  carbonio-videorecorder:
    image: ${CARBONIO_VIDEORECORDER_IMAGE:-registry.dev.zextras.com/dev/carbonio-videorecorder:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    volumes:
      - shared-videoserver-advanced:/var/lib/videoserver
    environment:
      - CARBONIO_ENV=docker

  carbonio-ws-collaboration:
    image: ${CARBONIO_WSC_IMAGE:-registry.dev.zextras.com/dev/carbonio-ws-collaboration:${CARBONIO_GLOBAL_IMAGES_TAG:-devel}}
    environment:
      - VIDEO_RECORDER_HOST=carbonio-videorecorder
      - VIDEO_RECORDER_PORT=8090
      - AUTH_HOST=carbonio-mailbox
      - AUTH_PORT=8742
      - LICENSE_SUBSCRIPTION_
      - LICENSE_
    depends_on:
      - carbonio-videorecorder

volumes:
  ldap_data_advanced:
  ldap_run_advanced:
  ldap_ca_advanced:
  mariadb_data_advanced:
  mailbox_data_advanced:
  mailbox_index_advanced:
  mailbox_store_advanced:
  app-volume-advanced:
  postgres_data_advanced:
    name: carbonio-postgres-data-advanced
  storages_data_advanced:
    name: carbonio-storages-data-advanced
  carbonio-message-broker_data_advanced:
    name: carbonio_message-broker_data_advanced
  shared-videoserver-advanced:
  consul-data-advanced:
